; ==============================================================================
; PHA — PHP 8.3 runtime tuning
; ==============================================================================

; Memory & execution
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 64M
upload_max_filesize = 64M

; Date
date.timezone = Asia/Manila

; Error handling (production = log only; dev = display)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; OPcache (critical for Octane worker mode)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

; JIT (PHP 8.3 — disable when worker mode + Octane until you've measured)
opcache.jit = 0

; Realpath cache
realpath_cache_size = 4M
realpath_cache_ttl = 600

; Sessions (we use Redis via Laravel anyway, but keep php sessions sane)
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
