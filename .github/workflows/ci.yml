name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend (Laravel + PHP 8.3)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend — Laravel 11 + PHP 8.3
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: Mypass123
          POSTGRES_DB: accountingdb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, gmp, intl, mbstring, opcache, pcntl, pdo_pgsql, pgsql, redis, zip
          coverage: pcov
          tools: composer:v2, pint, phpstan

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate APP_KEY
        run: php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Apply database init.sql
        env:
          PGPASSWORD: Mypass123
        run: psql -h localhost -U postgres -d accountingdb_test -f docker/postgres/init.sql

      - name: Migrate
        run: php artisan migrate --force

      - name: Run tests (Pest, parallel)
        run: vendor/bin/pest --parallel --coverage --min=70

  # ---------------------------------------------------------------------------
  # Frontend (React 18 + TypeScript)
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend — React 18 + TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --reporter=verbose

      - name: Build
        run: npm run build

      - name: Upload dist/ artifact (main + develop branches only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v4
        with:
          # Branch + short-sha lets a downstream deploy job pick the exact
          # build associated with the merge commit. Retention is short
          # because production deploys promote a versioned tag artefact
          # via the deploy.yml workflow, not this CI bundle.
          name: frontend-dist-${{ github.ref_name }}-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Database documentation drift check
  # ---------------------------------------------------------------------------
  docs-drift:
    name: ERD drift check
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - name: Verify ERD matches migrations
        run: |
          # Stub — replaced by `php artisan pha:check-erd-drift` once
          # the schemacrawler integration lands in Phase 0 close-out.
          echo "ERD drift check placeholder — TODO: hook up schemacrawler"
